networks:
  default:
    name: allure_task_default

services:

  selenoid:
    image: aerokube/selenoid:latest-release
    container_name: selenoid
    ports:
      - "4444:4444"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/etc/selenoid:ro
    shm_size: 2g
    environment:
      - DOCKER_API_VERSION=1.41
    privileged: true
    command:
      - "-container-network"
      - "allure_task_default"
      - "-conf"
      - "/etc/selenoid/browsers.json"
      - "-limit"
      - "1"
      
  test-runner:
    build: .
    depends_on:
      - selenoid
    volumes:
      - .:/app
    command: ["bash", "entrypoint.sh"]
